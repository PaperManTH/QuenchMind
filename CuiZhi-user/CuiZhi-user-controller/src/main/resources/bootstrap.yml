server:
  port: 18028

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/learnflow_auth?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.learnflow.auth.model.entity

logging:
  level:
    com.learnflow: debug

jwt:
  secret: cuizhi-secret-key
  expire: 86400