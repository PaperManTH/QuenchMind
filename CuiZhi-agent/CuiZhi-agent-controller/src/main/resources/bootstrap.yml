server:
  port: 18025

spring:
  application:
    name: agent-controller

  profiles:
    active: dev

  config:
    import:
      - optional:nacos:agent-controller-dev.yaml
      - optional:nacos:agent-service-dev.yaml
      - optional:nacos:swagger-dev.yaml
      - optional:nacos:logging-dev.yaml

  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        namespace: 6155490e-eda2-446d-b5de-85d176fb72cf
        group: QuenchMind
        file-extension: yaml
        refresh-enabled: true

      discovery:
        server-addr: localhost:8848
        namespace: 6155490e-eda2-446d-b5de-85d176fb72cf
        group: QuenchMind