server:
  port: 18023

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://cuizhi-auth
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://cuizhi-user
          predicates:
            - Path=/user/**

        - id: learning-service
          uri: lb://cuizhi-learning
          predicates:
            - Path=/learning/**

        - id: resource-service
          uri: lb://cuizhi-resource
          predicates:
            - Path=/resource/**

        - id: agent-service
          uri: lb://cuizhi-agent
          predicates:
            - Path=/agent/**